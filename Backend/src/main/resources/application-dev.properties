spring.application.name=E-learning_Backend

server.port=${SERVER_PORT:8080}
app.frontendurl=${APP_FRONTEND_URL:REDACTED}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:REDACTED}
spring.datasource.username=${DB_USERNAME:REDACTED}
spring.datasource.password=${DB_PASSWORD:REDACTED}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

file.upload-dir=${FILE_UPLOAD_DIR:./uploads/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.main.allow-bean-definition-overriding=true
spring.devtools.restart.enabled=false

# Spring Mail (SMTP)
spring.mail.host=${MAIL_HOST:REDACTED}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:REDACTED}
spring.mail.password=${MAIL_PASSWORD:REDACTED}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM_ADDRESS:${spring.mail.username}}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:REDACTED}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay Configuration
app.razorpay.key-id=${RAZORPAY_KEY_ID:REDACTED}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:REDACTED}

# Cloudinary Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:REDACTED}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:REDACTED}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:REDACTED}

# Google OAuth Client ID
app.google.client-id=${GOOGLE_CLIENT_ID:REDACTED}
