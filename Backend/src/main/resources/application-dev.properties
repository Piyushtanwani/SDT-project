spring.application.name=E-learning_Backend

server.port=${SERVER_PORT:8080}
app.frontendurl=${APP_FRONTEND_URL:http://localhost:3000}

# Zero-setup local database. Point DB_URL/DB_USERNAME/DB_PASSWORD at PostgreSQL to use one instead.
spring.datasource.url=${DB_URL:jdbc:h2:mem:sdt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

file.upload-dir=${FILE_UPLOAD_DIR:./uploads/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.main.allow-bean-definition-overriding=true
spring.devtools.restart.enabled=false

# Spring Mail (optional locally). When SMTP is unavailable, OTPs are printed to the server log.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM_ADDRESS:no-reply@localhost}
app.mail.log-fallback=${MAIL_LOG_FALLBACK:true}

# JWT. Set JWT_SECRET outside local development; an ephemeral key is generated otherwise.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay (optional locally). Payment endpoints return 503 until both values are set.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Cloudinary (optional locally).
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Google OAuth (optional locally).
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Messaging channels (optional). Leave blank to disable; the web app assistant works without them.
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.display-number=${WHATSAPP_DISPLAY_NUMBER:}

# Local demo administrator. Override or remove outside local development.
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
