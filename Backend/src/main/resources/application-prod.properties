spring.application.name=E-learning_Backend

server.port=${SERVER_PORT:8080}
app.frontendurl=${APP_FRONTEND_URL:https://www.elearning.bitecodes.com}

# PostgreSQL Database Configuration (Environment variables required in production)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Hibernate only validates here, so the proctoring columns and tables are applied by the script
# below. It runs before the entity manager is built and every statement is idempotent.
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads/}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.main.allow-bean-definition-overriding=true

# Spring Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM_ADDRESS:${spring.mail.username}}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay Configuration
app.razorpay.key-id=${RAZORPAY_KEY_ID}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Cloudinary Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Google OAuth Client ID
app.google.client-id=${GOOGLE_CLIENT_ID}

# Messaging channels (optional). The offline assistant works without them.
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
app.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.display-number=${WHATSAPP_DISPLAY_NUMBER:}

# Proctored exam policy. These are the shipped defaults; change one here and the rules the learner
# is shown change with it, because both are read from the same place.
app.exam.duration-minutes=${EXAM_DURATION_MINUTES:40}
app.exam.submit-grace-seconds=${EXAM_SUBMIT_GRACE_SECONDS:90}
app.exam.max-attempts=${EXAM_MAX_ATTEMPTS:3}
app.exam.cooldown-hours=${EXAM_COOLDOWN_HOURS:6}
app.exam.min-duration-seconds=${EXAM_MIN_DURATION_SECONDS:120}
app.exam.flag-threshold=${EXAM_FLAG_THRESHOLD:6}
app.exam.review-threshold=${EXAM_REVIEW_THRESHOLD:3}
app.exam.max-events-per-attempt=${EXAM_MAX_EVENTS_PER_ATTEMPT:400}
app.exam.max-snapshots-per-attempt=${EXAM_MAX_SNAPSHOTS_PER_ATTEMPT:15}
app.exam.max-snapshot-kb=${EXAM_MAX_SNAPSHOT_KB:200}
